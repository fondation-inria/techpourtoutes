name: "Notify Tchap on production deploy"

on:
  push:
    branches: [main, staging]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build the message
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: bash .github/scripts/build-tchap-deploy-message.sh > payload.json

      # The deployed SHA doubles as the Matrix transaction id, so re-running the job
      # never posts the same deploy twice.
      - uses: ./.github/actions/post-to-tchap
        with:
          payload-file: payload.json
          transaction-id: deploy-${{ github.sha }}
          homeserver: ${{ secrets.TCHAP_HOMESERVER }}
          room-id: ${{ secrets.TCHAP_ROOM_ID }}
          token: ${{ secrets.TCHAP_BOT_TOKEN }}
