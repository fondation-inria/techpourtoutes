name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: make lint

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: techpourtoutes
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      SECRET_KEY: ci-secret-key
      DEBUG: "True"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/techpourtoutes
      ALLOWED_HOSTS: localhost
      # Celery tasks run synchronously in tests (no Redis available in CI).
      # The test conftest also enforces this via an autouse fixture; setting it here
      # is a belt-and-suspenders guarantee that no task ever tries to reach a broker.
      CELERY_TASK_ALWAYS_EAGER: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      # `--with-deps` is omitted on purpose: it spent ~5 min in apt installing system libraries
      # the ubuntu runner already ships, while the browser download it gates is ~10 s.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: uv run playwright install chromium
      - run: make test

  # Scalingo's auto-deploy is off: it waited for every check on the commit, including workflows
  # that have nothing to do with the code. Deploying from here makes lint and test the only gate.
  deploy:
    if: github.event_name == 'push'
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: deploy-${{ github.ref_name }}
    permissions:
      contents: read
      pull-requests: read
      issues: read
    env:
      SCALINGO_APP: ${{ github.ref_name == 'main' && 'techpourtoutes' || 'techpourtoutes-staging' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build the announcement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: bash .github/scripts/build-tchap-deploy-message.sh > announcement.json

      # The deployed SHA doubles as the Matrix transaction id, so re-running the job
      # never posts the same deploy twice.
      - uses: ./.github/actions/post-to-tchap
        with:
          payload-file: announcement.json
          transaction-id: deploy-${{ github.sha }}
          homeserver: ${{ secrets.TCHAP_HOMESERVER }}
          room-id: ${{ secrets.TCHAP_ROOM_ID }}
          token: ${{ secrets.TCHAP_BOT_TOKEN }}

      - name: Deploy and build the report
        id: deployment
        env:
          SCALINGO_API_TOKEN: ${{ secrets.SCALINGO_API_TOKEN }}
          SCALINGO_API_URL: https://api.osc-fr1.scalingo.com
          SCALINGO_DEPLOYMENTS_URL: https://dashboard.scalingo.com/apps/osc-fr1/${{ env.SCALINGO_APP }}/deploy/list
          SHA: ${{ github.sha }}
        run: bash .github/scripts/deploy-to-scalingo.sh > report.json

      - uses: ./.github/actions/post-to-tchap
        with:
          payload-file: report.json
          transaction-id: deploy-result-${{ github.sha }}
          homeserver: ${{ secrets.TCHAP_HOMESERVER }}
          room-id: ${{ secrets.TCHAP_ROOM_ID }}
          token: ${{ secrets.TCHAP_BOT_TOKEN }}

      - name: Fail the job when the deploy did not succeed
        if: steps.deployment.outputs.status != 'success'
        run: exit 1
