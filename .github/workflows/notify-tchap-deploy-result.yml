name: "Notify Tchap of the production deploy result"

on:
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Wait for the Scalingo deployment and build the message
        id: deployment
        env:
          SCALINGO_API_TOKEN: ${{ secrets.SCALINGO_API_TOKEN }}
          SCALINGO_API_URL: https://api.osc-fr1.scalingo.com
          SCALINGO_APP: techpourtoutes
          SCALINGO_DEPLOYMENTS_URL: https://dashboard.scalingo.com/apps/osc-fr1/techpourtoutes/deploy/list
          SHA: ${{ github.sha }}
        run: bash .github/scripts/report-scalingo-deployment.sh > payload.json

      - uses: ./.github/actions/post-to-tchap
        with:
          payload-file: payload.json
          transaction-id: deploy-result-${{ github.sha }}
          homeserver: ${{ secrets.TCHAP_HOMESERVER }}
          room-id: ${{ secrets.TCHAP_ROOM_ID }}
          token: ${{ secrets.TCHAP_BOT_TOKEN }}

      # Reported in Tchap and reported here: a red cross on the commit says the same thing to
      # whoever looks at GitHub rather than at the room.
      - name: Fail the job when the deploy did not succeed
        if: steps.deployment.outputs.status != 'success'
        run: exit 1
