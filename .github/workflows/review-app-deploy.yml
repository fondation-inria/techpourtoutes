name: "Deploy review app"

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

jobs:
  deploy:
    if: >
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/deploy-review-app') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    environment: review-app
    concurrency:
      group: review-app-deploy-${{ github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/install-scalingo-cli

      - run: scalingo login --api-token ${{ secrets.SCALINGO_API_TOKEN }}

      - name: Set PR number
        id: pr
        run: echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"

      # Generated up front so the failure report at the end of the job can use it too:
      # a token minted after the deploy step would never exist when that step is the one failing.
      - name: Generate app token for PR comment
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Create review app and wait for its first deploy
        id: review-app
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SCALINGO_API_TOKEN: ${{ secrets.SCALINGO_API_TOKEN }}
          SCALINGO_API_URL: https://api.osc-fr1.scalingo.com
        run: |
          bearer=$(curl -sf -u ":$SCALINGO_API_TOKEN" -X POST https://auth.scalingo.com/v1/tokens/exchange | jq -r .token)

          find_review_app() {
            curl -sf -H "Authorization: Bearer $bearer" \
              "$SCALINGO_API_URL/v1/apps/techpourtoutes-staging/scm_repo_link/review_apps" |
              jq -c --arg pr "$PR_NUMBER" '.review_apps[] | select(.pull_request.number == ($pr | tonumber))'
          }

          review_app=$(find_review_app)
          if [ -z "$review_app" ]; then
            echo "Creating review app for PR $PR_NUMBER..."
            scalingo --app techpourtoutes-staging integration-link-manual-review-app --aware-of-security-risks "$PR_NUMBER"
          else
            echo "Review app for PR $PR_NUMBER already exists."
          fi

          status=""
          for i in $(seq 1 90); do
            review_app=$(find_review_app)
            status=$(echo "$review_app" | jq -r '.last_deployment.status // empty')
            case "$status" in
              success) break ;;
              *-error|aborted)
                echo "status=$status" >> "$GITHUB_OUTPUT"
                echo "Review app deploy failed (status: $status)." >&2
                exit 1
                ;;
            esac
            echo "Waiting for review app deploy to finish (status: ${status:-pending})..."
            sleep 10
          done

          if [ "$status" != "success" ]; then
            echo "status=${status:-pending}" >> "$GITHUB_OUTPUT"
            echo "Timed out after 15 minutes waiting for the review app deploy to succeed (last status: ${status:-pending})." >&2
            exit 1
          fi

          app_name=$(echo "$review_app" | jq -r '.app_name')
          url=$(curl -sf -H "Authorization: Bearer $bearer" "$SCALINGO_API_URL/v1/apps/$app_name" | jq -r '.app.url')
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Configure review app host
        env:
          REVIEW_APP: techpourtoutes-staging-pr${{ steps.pr.outputs.number }}
          URL: ${{ steps.review-app.outputs.url }}
        run: |
          domain="${URL#https://}"
          domain="${domain#http://}"
          domain="${domain%%/*}"
          scalingo --app "$REVIEW_APP" env-set \
            "ALLOWED_HOSTS=$domain" "HOST=$URL" "DISABLE_ADMIN_2FA=true" "SEED_ENABLED=true"

      # Review apps inherit the parent app's literal CACHE_URL, which points at staging's Redis.
      # Scalingo's `$VAR` alias only works as a whole value, so the db index is appended here.
      - name: Point the review app cache at its own Redis
        env:
          REVIEW_APP: techpourtoutes-staging-pr${{ steps.pr.outputs.number }}
        run: |
          redis_url=$(scalingo --app "$REVIEW_APP" env | sed -n 's/^SCALINGO_REDIS_URL=//p')
          echo "::add-mask::$redis_url"
          scalingo --app "$REVIEW_APP" env-set "CACHE_URL=$redis_url/1"

      - name: Parse extra env vars from comment
        id: extra-env
        uses: actions/github-script@v9
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        with:
          script: |
            const body = process.env.COMMENT_BODY || "";
            const tokens = body.trim().split(/\s+/).slice(1);
            const setPattern = /^[A-Z_][A-Z0-9_]*=.*$/;
            const unsetPattern = /^[A-Z_][A-Z0-9_]*-$/;
            const sets = [];
            const unsets = [];
            for (const token of tokens) {
              if (setPattern.test(token)) {
                sets.push(token);
              } else if (unsetPattern.test(token)) {
                unsets.push(token.slice(0, -1));
              } else {
                core.setFailed(`Token invalide dans le commentaire : "${token}". Utilisez KEY=VALUE ou KEY-.`);
                return;
              }
            }
            core.setOutput("sets", JSON.stringify(sets));
            core.setOutput("unsets", JSON.stringify(unsets));

      - name: Apply extra env vars
        env:
          REVIEW_APP: techpourtoutes-staging-pr${{ steps.pr.outputs.number }}
          SETS_JSON: ${{ steps.extra-env.outputs.sets }}
          UNSETS_JSON: ${{ steps.extra-env.outputs.unsets }}
        run: |
          echo "$SETS_JSON" | jq -r '.[]' | while IFS= read -r pair; do
            scalingo --app "$REVIEW_APP" env-set "$pair"
          done
          echo "$UNSETS_JSON" | jq -r '.[]' | while IFS= read -r key; do
            scalingo --app "$REVIEW_APP" env-unset "$key"
          done

      # `env-set`/`env-unset` don't restart the app on their own; the running web/worker
      # containers keep the environment they booted with until restarted.
      - name: Restart review app
        env:
          REVIEW_APP: techpourtoutes-staging-pr${{ steps.pr.outputs.number }}
        run: scalingo --app "$REVIEW_APP" restart --synchronous

      - name: Seed review app
        env:
          REVIEW_APP: techpourtoutes-staging-pr${{ steps.pr.outputs.number }}
        run: scalingo --app "$REVIEW_APP" run python manage.py seed

      - name: Comment PR with review app URL
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          comment_id: ${{ github.event.comment.id }}
          issue-number: ${{ steps.pr.outputs.number }}
          body: |
            Review app ready :
            ${{ steps.review-app.outputs.url }}

      - name: Report failure on the PR
        if: failure()
        uses: actions/github-script@v9
        env:
          DEPLOY_STATUS: ${{ steps.review-app.outputs.status }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const status = process.env.DEPLOY_STATUS || "";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // A terminal Scalingo status sticks: the deploy step only creates a review app that is
            // absent, so re-running the command re-reads the same failure until the app is destroyed.
            let advice;
            if (/(-error|aborted)$/.test(status)) {
              advice = "Le build Scalingo a échoué. Relancer `/deploy-review-app` relira le même échec : lancez `/destroy-review-app` puis `/deploy-review-app`, ou poussez un nouveau commit.";
            } else if (status) {
              advice = "Le déploiement n'a pas abouti dans le temps imparti. Il se poursuit peut-être côté Scalingo : relancez `/deploy-review-app` dans quelques minutes.";
            } else {
              advice = "L'échec ne vient pas du déploiement lui-même mais d'une étape autour (configuration, restart ou seed) : voir les logs du workflow.";
            }
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `Échec du déploiement de la review app${status ? ` (statut : \`${status}\`)` : ""}.\n\n${advice}\n\n[Logs du workflow](${runUrl})`,
            });
