<c-vars label="" name="" id="" icon="" :options=[] tint_class="bg-neutral-0" selection_target="" class="" />

<div x-data="{
        open: false,
        selected: [],
        groupToggle(input) { return input.closest('[data-group]')?.querySelector('[data-group-toggle] input') },
        cascade(input) {
            const toggle = this.groupToggle(input);
            if (!toggle) return;
            const members = [...toggle.closest('[data-group]').querySelectorAll('[data-group-member] input')];
            if (input === toggle) members.forEach(member => member.checked = toggle.checked);
            const checkedCount = members.filter(member => member.checked).length;
            toggle.checked = checkedCount === members.length;
            toggle.indeterminate = checkedCount > 0 && !toggle.checked;
        },
        sync() {
            this.selected = [...this.$refs.panel.querySelectorAll('input:checked')]
                .filter(input => input.closest('[data-group-toggle]') || !this.groupToggle(input)?.checked)
                .map(input => ({ id: input.id, label: input.labels[0].textContent.trim() }));
        },
        remove(id) {
            const input = document.getElementById(id);
            input.checked = false;
            this.cascade(input);
            this.sync();
            this.$refs.button.focus();
        },
     }"
     @click.outside="open = false"
     @focusout="if ($event.relatedTarget && !$el.contains($event.relatedTarget) && !$event.relatedTarget.contains($el)) open = false"
     @keydown.escape="if (open) { open = false; $refs.button.focus() }"
     class="relative inline-block {{ class }}">
    <button type="button" id="{{ id }}" x-ref="button"
            @click="open = !open"
            :aria-expanded="open" aria-controls="{{ id }}_panel"
            class="flex items-center gap-2 px-4 py-3 rounded-sm text-sm font-normal leading-[1.4] bg-neutral-0 text-black border border-black shadow-bottom-and-right shadow-black hover:font-medium hover:shadow-bottom-and-right-lg focus-visible:outline-2 focus-visible:outline-blue-500 focus-visible:outline-offset-2 cursor-pointer">
        {% if icon %}<c-components.icon name="{{ icon }}" class="w-5 h-5 shrink-0" />{% endif %}
        <span>{{ label }}</span>
        <span x-show="selected.length" x-cloak class="inline-flex items-center justify-center w-6 h-6 rounded-full border border-black text-xs {{ tint_class }}">
            <span x-text="selected.length"></span><span class="sr-only">&nbsp;sélectionné(s)</span>
        </span>
        <span class="shrink-0 transition-transform" :class="open && 'rotate-180'"><c-components.icon name="chevron-down" class="w-4 h-4" /></span>
    </button>
    <fieldset id="{{ id }}_panel" x-ref="panel" x-show="open" x-cloak @change="cascade($event.target); sync()"
              class="absolute left-0 z-20 mt-2 w-max min-w-full max-h-72 overflow-y-auto p-4 rounded-sm bg-neutral-0 border border-black shadow-bottom-and-right shadow-black">
        <legend class="sr-only">{{ label }}</legend>
        <div class="flex flex-col gap-3">
            {% if slot %}
                {{ slot }}
            {% else %}
                {% for value, option_label in options %}
                    <c-components.form_fields.checkbox name="{{ name }}" id="{{ id }}_{{ forloop.counter0 }}" value="{{ value }}" label="{{ option_label }}" />
                {% endfor %}
            {% endif %}
        </div>
    </fieldset>
    <template x-teleport="{{ selection_target }}">
        <ul aria-label="{{ label }}" class="hidden has-[li]:flex flex-wrap items-center gap-2">
            <template x-for="option in selected" :key="option.id">
                <li class="flex items-center gap-1 py-1 pl-1 pr-3 rounded-full border border-black text-xs {{ tint_class }}">
                    <button type="button" @click="remove(option.id)"
                            :aria-label="'Retirer le filtre ' + option.label"
                            class="rounded-full p-0.5 hover:bg-black/10 focus-visible:outline-2 focus-visible:outline-blue-500 cursor-pointer">
                        <c-components.icon name="close" class="w-3 h-3" />
                    </button>
                    <span x-text="option.label"></span>
                </li>
            </template>
        </ul>
    </template>
</div>
