<c-vars
    field=field
    label=""
    description=""
    message=""
    :errors=[]
    name=""
    variant="default"
    class=""
    :watchable=False
/>

{# Radios rendered as a row of buttons. Unlike `radio.html` it can announce a change, the way #}
{# `select.html` does, because the fields it drives are revealed client-side. #}
<c-components.form-fields.base label=label description=description message=message class=class span_label=True>
    <div role="radiogroup" class="inline-flex flex-wrap">
        {% for opt_value, opt_label in field.field.choices %}
            <label class="cursor-pointer">
                <input
                    type="radio"
                    name="{{ field.html_name|default:name }}"
                    value="{{ opt_value }}"
                    {% if field.value|stringformat:"s" == opt_value|stringformat:"s" %}checked{% endif %}
                    {% if variant == "disabled" %}disabled{% endif %}
                    {% if watchable %}@change="$el.dispatchEvent(new CustomEvent('segmented-change', { bubbles: true, detail: { name: '{{ field.html_name|escapejs }}', value: '{{ opt_value|escapejs }}' } }))"{% endif %}
                    class="peer sr-only"
                />
                <span class="inline-block border border-neutral-300 px-4 py-2 text-sm text-neutral-950 -ml-px peer-checked:bg-primary/20 peer-checked:border-primary peer-checked:relative peer-focus-visible:outline peer-focus-visible:outline-blue-500 {% if field.errors or errors or variant == "error" %}border-error{% endif %}">
                    {{ opt_label }}
                </span>
            </label>
        {% endfor %}
    </div>
</c-components.form-fields.base>
