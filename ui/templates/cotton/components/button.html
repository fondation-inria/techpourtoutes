<c-vars
    label=""
    href=""
    disabled=False
    type="button"
    base_class="inline-block px-6 py-3 rounded-sm text-sm font-normal leading-[1.4] focus-visible:outline-none focus-visible:border"
    primary_class="bg-yellow-500 text-neutral-950 shadow-bottom-and-right shadow-black focus-visible:border-neutral-0 hover:font-medium hover:shadow-bottom-and-right-lg active:shadow-none cursor-pointer"
    primary_danger_class="bg-error-700 text-neutral-0 shadow-bottom-and-right shadow-black focus-visible:border-neutral-0 hover:bg-error-500 active:bg-error-500 cursor-pointer"
    secondary_class="bg-neutral-0 text-black border border-black shadow-bottom-and-right shadow-black focus-visible:border-neutral-0 hover:shadow-bottom-and-right-lg active:bg-black active:text-neutral-0 active:shadow-none cursor-pointer"
    tertiary_class="inline-block text-neutral-950 bg-yellow-500/20 hover:bg-orange-500 active:bg-yellow-500 focus:outline-blue-500 text-sm font-medium p-3 rounded-sm cursor-pointer"
    link_class="text-[11px] font-normal leading-[1.4] underline decoration-1 underline-offset-4 hover:decoration-2 active:bg-neutral-200 active:decoration-2 focus:outline-blue-500 focus:outline-offset-2 cursor-pointer"
    tertiary_danger_class="text-error-700 hover:bg-error-50 active:bg-error-100 active:text-error-900 focus:outline-error-500 focus:outline-offset-2 cursor-pointer"
    icon_only_class="hover:bg-primary/20 active:bg-primary/40 focus:outline-blue-500 focus:outline-offset-2 cursor-pointer"
    disabled_primary_class="bg-neutral-300 text-black cursor-not-allowed select-none shadow-black"
    disabled_secondary_class="bg-neutral-500 text-neutral-0 cursor-not-allowed select-none shadow-black"
    disabled_tertiary_class="inline-block text-neutral-500 cursor-not-allowed"
    disabled_icon_only_class="text-neutral-500 bg-neutral-200 cursor-not-allowed"
    icon_class="gap-x-2"
    icon_size_class="w-5 h-5"
    class=""
    variant=""
    icon=""
    icon_position="end"
/>

    {% if href and not disabled %}
        <a href="{{ href }}"
           class="
            {% if variant == "secondary" %}
                {{ base_class }} {{ secondary_class }}
            {% elif variant == "tertiary" %}
                {{ tertiary_class }}
            {% elif variant == "link" %}
                {{ link_class }}
            {% elif variant == "tertiary_danger" %}
                {{ base_class }} {{ tertiary_danger_class }}
            {% elif variant == "icon" %}
                {{ icon_only_class }}
            {% elif variant == "primary_danger" %}
                {{ base_class }} {{ primary_danger_class }}
            {% else %}
                {{ base_class }} {{ primary_class }}
            {% endif %}
            {{ class }}"
            {{ attrs }}
        >
            <div class="flex
                {% if icon %}{{ icon_class }}{% endif %}
                {% if "primary" in variant or variant == "secondary" %}
                    justify-center
                {% endif %}
            ">
                {% if icon and icon_position == "start" %}<c-components.icon name="{{ icon }}" class="{{ icon_size_class }}" />{% endif %}
                {% if slot %}{{ slot|safe }}{% else %}{{ label|safe }}{% endif %}
                {% if icon and icon_position == "end" %}<c-components.icon name="{{ icon }}" class="{{ icon_size_class }}" />{% endif %}
            </div>
        </a>
    {% else %}
        <button type="{{ type }}"
                {% if disabled %}disabled{% endif %}
                class="
                {% if disabled %}
                    {% if variant == "secondary" %}
                        {{ base_class }} {{ disabled_secondary_class }}
                    {% elif variant == "tertiary" or variant == "tertiary_danger" %}
                        {{ disabled_tertiary_class }}
                    {% elif variant == "icon" %}
                        {{ disabled_icon_only_class }}
                    {% else %}
                        {{ base_class }} {{ disabled_primary_class }}
                    {% endif %}
                {% else %}
                    {% if variant == "secondary" %}
                        {{ base_class }} {{ secondary_class }}
                    {% elif variant == "tertiary" %}
                        {{ tertiary_class }}
                    {% elif variant == "link" %}
                        {{ link_class }}
                    {% elif variant == "tertiary_danger" %}
                        {{ base_class }} {{ tertiary_danger_class }}
                    {% elif variant == "icon" %}
                        {{ icon_only_class }}
                    {% elif variant == "primary_danger" %}
                        {{ base_class }} {{ primary_danger_class }}
                    {% else %}
                        {{ base_class }} {{ primary_class }}
                    {% endif %}
                {% endif %}
                {{ class }}"
                {{ attrs }}
        >
            <div class="flex
                {% if icon %}{{ icon_class }}{% endif %}
                {% if "primary" in variant or variant == "secondary" %}
                    justify-center
                {% endif %}
            ">
                {% if icon and icon_position == "start" %}<c-components.icon name="{{ icon }}" class="{{ icon_size_class }}" />{% endif %}
                {% if slot %}{{ slot|safe }}{% else %}{{ label|safe }}{% endif %}
                {% if icon and icon_position == "end" %}<c-components.icon name="{{ icon }}" class="{{ icon_size_class }}" />{% endif %}
            </div>
        </button>
    {% endif %}
