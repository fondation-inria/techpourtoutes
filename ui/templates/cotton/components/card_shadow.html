<c-vars
    id=""
    variant=""
    class=""
    href=""
/>

{% if href %}
<a href="{{ href }}" id="{{ id }}" class="shadow-bottom-and-right border border-black p-5 focus:outline-blue-500 focus:outline-offset-3 bg-neutral-0 {{ class }}">
    {{ slot }}
</a>
{% else %}
<div id="{{ id }}" class="shadow-bottom-and-right border border-black p-5 focus:outline-blue-500 focus:outline-offset-3 bg-neutral-0 {{ class }}">
    {{ slot }}
</div>
{% endif %}
