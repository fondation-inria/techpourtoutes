<c-vars
    id=""
    variant=""
    class=""
    href=""
/>

{% if href %}
<a href="{{ href }}" id="{{ id }}" class="rounded-2xl shadow-bottom-and-right border border-purple-500 p-5 focus:outline-primary-500 focus:outline-offset-3 bg-neutral-0 {{ class }}">
    {{ slot }}
</a>
{% else %}
<div id="{{ id }}" class="rounded-2xl shadow-bottom-and-right border border-purple-500 p-5 focus:outline-primary-500 focus:outline-offset-3 bg-neutral-0 {{ class }}">
    {{ slot }}
</div>
{% endif %}
