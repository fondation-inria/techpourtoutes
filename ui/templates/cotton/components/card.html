<c-vars title="" class="" nobg=False header="" header_color="" />

{% if header %}<div>
    <div class="w-fit {{ header_color }} text-white text-xl font-bold px-4 py-2">
        {{ header|safe }}
    </div>
{% endif %}
<div class="p-4 w-full{% if nobg != True %} bg-neutral-0 border border-y-neutral-950 shadow-[2px_2px_20px_rgba(0,0,0,0.1)]{% endif %} {{ class }}">
    {% if title %}
        <c-components.title title="{{ title|safe }}" variant="h2" />
    {% endif %}
    <div class="text-black leading-[1.4] w-full">
        {{ slot }}
    </div>
</div>
{% if header %}</div>{% endif %}
