<c-vars name="" variant="svg" class="" />
{% load static %}

{% if name and variant == "svg" %}
    {# Sized by its classes; without a stylesheet it keeps the size of the text around it. #}
    <svg class="{{ class }}" width="1em" height="1em" aria-hidden="true" focusable="false">
        <use href="{% static 'svg/sprite.svg' %}#{{ name }}" />
    </svg>
{% elif name %}
    <img class="{{ class }}" src="{% static 'images/'|add:name|add:'.webp' %}" alt="{{ name }}" loading="lazy" decoding="async">
{% endif %}
