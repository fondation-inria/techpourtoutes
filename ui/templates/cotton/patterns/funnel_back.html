{# A POST, not a link: the funnel's view decides which screen comes before. #}
<c-vars post_url="" target_id="funnel-step" />

<c-patterns.form
    hx-post="{{ post_url }}"
    hx-target="#{{ target_id }}"
    hx-swap="outerHTML"
    :attrs="attrs">
    <input type="hidden" name="action" value="back">
    {{ slot }}
    <c-components.button type="submit" variant="tertiary" class="w-fit px-4 bg-white! hover:bg-secondary/20! active:bg-orange-500! text-neutral-900! font-normal">
        <span class="flex items-center gap-1">
            <c-components.icon name="chevron-down" class="w-4 h-4 rotate-90" />
            Retour
        </span>
    </c-components.button>
</c-patterns.form>
