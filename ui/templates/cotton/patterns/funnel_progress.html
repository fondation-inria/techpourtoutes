{# Back, the bar, and — on a screen she may skip — the button opening the confirmation modal. #}
<c-vars post_url="" target_id="funnel-step" progress="" skip_url="" />

<div class="flex flex-col gap-y-2">
    <div class="flex items-center justify-between">
        <c-patterns.funnel_back post_url="{{ post_url }}" target_id="{{ target_id }}" />
        {% if skip_url %}
            <c-components.button
                label="Passer"
                type="button"
                variant="tertiary"
                class="w-fit px-1 text-neutral-900! bg-white! hover:bg-secondary/20! active:bg-orange-500! font-normal"
                hx-get="{{ skip_url }}"
                hx-target="#modal-container"
                hx-swap="innerHTML"
            />
        {% endif %}
    </div>
    <div class="bg-yellow-500 mx-4 h-2 overflow-hidden">
        <div class="bg-green-500 h-full" style="width: {{ progress }}%"></div>
    </div>
</div>
{% if skip_url %}
    <div id="modal-container"></div>
{% endif %}
