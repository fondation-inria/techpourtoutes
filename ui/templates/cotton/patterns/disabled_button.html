<c-vars label="" variant="" reason="" />

{# The button stays focusable, so the keyboard reaches its reason too; a tap counts as a hover. #}
<span class="relative inline-block"
      x-data="{ tip: false }"
      x-id="['reason']"
      @mouseenter="tip = true"
      @mouseleave="tip = false"
      @focusin="tip = true"
      @focusout="tip = false"
      @keydown.escape.window="tip = false">
    <c-components.button label="{{ label }}" variant="{{ variant }}" :disabled="True" x-bind:aria-describedby="$id('reason')" />
    <span role="tooltip" :id="$id('reason')" x-show="tip" x-cloak class="absolute left-1/2 bottom-full z-30 w-72 max-w-[80vw] -translate-x-1/2 rounded border-b-4 border-transparent bg-neutral-950 bg-clip-padding px-3 py-2 text-xs text-neutral-50">{{ reason }}</span>
</span>
