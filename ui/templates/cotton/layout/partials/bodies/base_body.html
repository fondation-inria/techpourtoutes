<c-vars right="" decorations="" banner="" mobile_cta="" />
{% load coalition_page %}
{% is_coalition_page as is_coalition_page %}

<body class="min-h-screen font-sans text-neutral-900 drawer xl:drawer-open"
      x-data="{ menuOpen: false }"
      @keydown.escape.window="if (menuOpen) { menuOpen = false; $refs.burger.focus() }"
      @resize.window="if (matchMedia('(min-width: 80rem)').matches) menuOpen = false">
    <div :inert="menuOpen">
        <c-layout.partials.skip_link />
        {% if decorations %}
            <div class="pointer-events-none absolute inset-0 -z-10 overflow-hidden" aria-hidden="true">{{ decorations }}</div>
        {% endif %}
        <c-layout.partials.messages />
    </div>
    <input id="sidebar-drawer" type="checkbox" class="drawer-toggle" aria-label="Menu" x-ref="burger" x-model="menuOpen" />
    <div class="drawer-side z-40">
        <label for="sidebar-drawer" class="drawer-overlay xl:hidden"></label>
        <c-layout.partials.sidebars.sidebar-base />
    </div>
    <label for="sidebar-drawer" class="outline-blue-500 [body:has(#sidebar-drawer:focus-visible)_&]:outline-2 [body:has(#sidebar-drawer:focus-visible)_&]:outline-offset-2 hidden [body:has(#sidebar-drawer:checked)_&]:block fixed right-4 top-4 z-[110] cursor-pointer p-1 text-neutral-900 text-xl leading-none">&times;</label>
    <div class="drawer-content flex flex-col min-h-screen @container" :inert="menuOpen">
        <header hidden="until-found" class="xl:hidden flex [content-visibility:visible] h-(--grid-cell) items-center justify-between px-4 bg-neutral-0 border-b z-100 [@media(max-height:600px)]:z-0">
            <label for="sidebar-drawer" class="drawer-button outline-blue-500 [body:has(#sidebar-drawer:checked)_&]:invisible cursor-pointer p-1">
                <c-components.icon name="menu-burger-{% if is_coalition_page %}pro{% else %}beneficiary{% endif %}" class="w-6 h-6" />
            </label>
            <c-components.brand-mark />
            <div />
        </header>
        {% if banner %}
            <div class="h-(--grid-cell) w-full bg-neutral-0">{{ banner }}</div>
        {% endif %}
        <div class="flex flex-col justify-between items-center w-full flex-1 {% if mobile_cta %}pb-20 md:pb-0{% endif %}">
            <main id="contenu" tabindex="-1" class="focus:outline-none flex flex-1 max-w-6xl w-full flex-col md:flex-row md:justify-around">
                <div class="flex flex-col flex-1 py-8 px-4 md:px-8 gap-y-4 items-start justify-start {% if right %}max-w-2xl{% else %}max-w-4xl{% endif %}">
                    {{ slot }}
                </div>
                {{ right }}
            </main>
            <c-layout.partials.footer />
        </div>
        {% if mobile_cta %}
            <div class="fixed inset-x-0 bottom-0 z-20 md:hidden flex justify-center p-4 border-t border-black bg-white">
                {{ mobile_cta }}
            </div>
        {% endif %}
    </div>
</body>
