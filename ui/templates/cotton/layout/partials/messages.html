<c-vars wrapper_class="fixed bottom-4 left-4 right-4 md:left-auto md:right-8 md:bottom-8 md:w-1/2 z-[110] flex flex-col gap-y-2" oob_swap="" />

<div id="messages"{% if oob_swap %} hx-swap-oob="{{ oob_swap }}"{% endif %}>
    {% if messages %}
        <div x-data="{ visible: {{ messages|length }} }"
             x-show="visible > 0"
             class="{{ wrapper_class }}">
            {% for message in messages %}
                <div x-data="{ show: true }"
                     x-show="show"
                     x-transition.opacity.duration.300ms
                     {% if message.tags == 'success' %}x-init="setTimeout(() => { show = false; setTimeout(() => visible--, 300) }, 5000)"{% endif %}
                     role="alert"
                     class="alert {% if message.tags == 'error' %}alert-error{% elif message.tags == 'success' %}alert-success{% else %}alert-info{% endif %} flex items-center justify-between">
                    <span>{{ message }}</span>
                    <button type="button" @click="show = false; setTimeout(() => visible--, 300)" aria-label="Fermer" class="ml-4 text-xl leading-none cursor-pointer focus-visible:outline-none focus-visible:border focus-visible:border-current">&times;</button>
                </div>
            {% endfor %}
        </div>
    {% endif %}
</div>
