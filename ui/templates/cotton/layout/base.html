<!DOCTYPE html>
<c-vars title="TechPourToutes" description="" og_image="" variant="default" right="" back="" footer=True head_js="" decorations="" />

{# The grid sits on <html>, not <body>: a background on <body> would paint over the decorations layer #}
<html lang="fr" data-theme="techpourtoutes" class="{% if variant != "funnel" %}bg-grid{% endif %}">
    <c-layout.partials.head title="{{ title }}" description="{{ description }}" og_image="{{ og_image }}" head_js="{{ head_js }}" />

    {% if variant == "funnel" %}
        <c-layout.partials.bodies.funnel_body back="{{ back }}" right="{{ right }}" :footer="footer">{{ slot }}</c-layout.partials.bodies.funnel_body>
    {% else %}
        <c-layout.partials.bodies.base_body right="{{ right }}" decorations="{{ decorations }}" banner="{{ banner }}">{{ slot }}</c-layout.partials.bodies.base_body>
    {% endif %}
</html>
