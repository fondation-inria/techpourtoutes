{% load static %}
<c-layout.base
    variant="funnel"
    title="Échanger avec une étudiante – TechPourToutes"
    description="Demande à échanger avec une étudiante ambassadrice TechPourToutes."
    back="{% url 'new_training_ambassador_beneficiary' %}">
    <div class="w-full md:max-w-xl flex flex-col py-8">
        <img src="{% static 'images/techpourtoutes-logo-new-beneficiary.png' %}" alt="logo TechPourToutes" class="w-48 shrink-0 mb-8" width="1344" height="372" decoding="async" />
        <c-components.card nobg=True>
            <c-patterns.form url="{% url 'create_training_ambassador_request' %}">
                <c-components.title title="Échanger avec une étudiante" variant="h1" />
                {% include "beneficiary/funnels/partials/inscription/training_ambassador_request_fields.html" %}
                <div class="flex justify-center">
                    <c-components.button type="submit" label="Envoyer ma demande" />
                </div>
            </c-patterns.form>
        </c-components.card>
    </div>
    <c-slot name="right">
        <div class="hidden md:block flex-1">
            <img src="{% static 'images/inscription-funnel-hero.webp' %}"
                 alt="Le futur sera numérique... et féminin"
                 class="w-full h-full object-cover"
                 width="1128" height="1600" loading="lazy" decoding="async" />
        </div>
    </c-slot>
</c-layout.base>
