<c-layout.base
    title="{{ event.title }}"
    description="{{ event.description }}"
>
    <div class="bg-yellow-500">
            <c-components.button href="#" variant="tertiary" class="w-fit px-4 hover:bg-white/20! active:bg-orange-500! text-neutral-900! font-normal">
                <span class="flex items-center gap-1">
                    <c-components.icon name="chevron-down" class="w-4 h-4 rotate-90" />
                    Retour
                </span>
            </c-components.button>

        <c-components.title title="{{ event.title }}" class="mb-(--grid-cell)" />
    </div>

</c-layout.base>
