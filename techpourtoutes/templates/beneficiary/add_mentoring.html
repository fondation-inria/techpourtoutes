{% load static %}
<c-layout.base
    variant="funnel"
    title="Rejoindre le mentorat – TechPourToutes"
    description="Termine ton inscription au programme de mentorat TechPourToutes."
    footer=False
    back="{% url 'find_mentor_landing' %}">
    <div class="w-full md:max-w-xl flex flex-col py-8">
        <img src="{% static 'images/techpourtoutes-logo-new-beneficiary.png' %}" alt="logo TechPourToutes" class="w-48 shrink-0 mb-8" />
        {# The shell only renders the first screen: every step after it arrives through htmx. #}
        {% include "beneficiary/partials/mentoring/step.html" %}
    </div>
    <c-slot name="right">
        <div class="hidden md:block flex-1">
            <img src="{% static 'images/inscription-funnel-hero.webp' %}"
                 alt="Le futur sera numérique... et féminin"
                 class="w-full h-full object-cover" />
        </div>
    </c-slot>
</c-layout.base>
