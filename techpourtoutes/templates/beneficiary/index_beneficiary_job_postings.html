{% load static %}

<c-layout.base title="Mes opportunités – TechPourToutes">
    <div class="w-full flex flex-col lg:flex-row lg:items-center lg:justify-between">
        <c-components.title title="Mes opportunités" title_bg="green" />
        <div class="mt-8 lg:m-0">
            <c-components.button label="Voir toutes les opportunités" href="{% url "index_job_postings" %}" class="shrink-0" />
        </div>
    </div>

    <div id="candidatures-entamees" class="w-full flex flex-col gap-y-4 items-start">
        <c-components.card title="Candidatures entamées" title_bg="black" class="mt-9 sm:mt-12" />
        {% if job_postings_clicked %}
            <div class="grid gap-4">
                {% for job_posting in job_postings_clicked %}
                    <c-components.job-posting-card :job_posting="job_posting" anchor_prefix="candidature" />
                {% endfor %}
            </div>
            <div class="mt-4 flex justify-center self-center">
                <c-components.pagination :page="job_postings_clicked" param="job_postings_clicked_page" anchor="candidatures-entamees" reload="true" query="job_postings_saved_page={{ job_postings_saved.number }}" />
            </div>
        {% else %}
            <c-components.card>Tu n'as aucune candidature ou opportunité enregistrée.</c-components.card>
            <img src="{% static 'images/empty-event-bg.webp' %}" alt="" aria-hidden="true"
                 class="w-full" width="1344" height="868" loading="lazy" decoding="async" />
        {% endif %}
    </div>

    <div id="opportunites-enregistrees" class="w-full flex flex-col gap-y-4 items-start">
        <c-components.card title="Opportunités enregistrées" title_bg="black" />
        {% if job_postings_saved %}
            <div class="grid gap-4">
            {% for job_posting in job_postings_saved %}
                <c-components.job-posting-card :job_posting="job_posting" anchor_prefix="enregistree" />
            {% endfor %}
            </div>
            <div class="mt-4 flex justify-center self-center">
                <c-components.pagination :page="job_postings_saved" param="job_postings_saved_page" anchor="opportunites-enregistrees" reload="true" query="job_postings_clicked_page={{ job_postings_clicked.number }}" />
            </div>
        {% endif %}
    </div>

</c-layout.base>
