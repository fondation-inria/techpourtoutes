<c-components.modal title="Es-tu sûre de vouloir passer cette étape ?">
    <br>
    <p class="text-center text-sm">
        Pour te mettre en relation avec une {% if step == "mentoring_signup" %}mentor{% else %}ambassadrice{% endif %}, nous avons besoin que tu nous transmettes ces informations.
        <br><br>
        Si tu passes cette étape, tu pourras toujours compléter le formulaire plus tard dans ton espace personnel.
    </p>
    <br>
    <div class="flex justify-center">
        <c-patterns.form
            hx-post="{% url 'inscription_funnel' %}"
            hx-target="#funnel-step"
            hx-swap="outerHTML"
            class="max-w-lg"
        >
            <input type="hidden" name="action" value="skip">
            <input type="hidden" name="step" value="{{ step }}">
            <div class="flex flex-col items-center gap-4">
                <c-components.button
                    label="Compléter le formulaire"
                    type="button"
                    variant="primary"
                    hx-on:click="this.closest('dialog').close()"
                />
                <c-components.button
                    label="Passer"
                    variant="secondary"
                    type="submit"
                />
            </div>
        </c-patterns.form>
    </div>
</c-components.modal>
