{% if study_status == "high_school" %}
    <c-components.form_fields.select field=form.level />
    <c-components.form_fields.school_search
        name_field=form.school_label
        id_field=form.school_id
        not_found_field=form.school_not_found
        scope="secondary"
        description="Saisis le nom et/ou code postal de l'établissement"
        group="{{ form.dom_id }}"
        unique_id="{{ form.dom_id }}" />
    {% include "beneficiary/funnels/partials/fields/out_of_scope_postal_code.html" %}
    <c-components.form_fields.formation_search
        name_field=form.formation_label
        id_field=form.formation_id
        not_found_field=form.formation_not_found
        school_id_field=form.school_id
        scope="secondary"
        description="Recherche par nom"
        group="{{ form.dom_id }}"
        unique_id="{{ form.dom_id }}" />
{% elif study_status == "higher_education" %}
    <c-components.form_fields.select field=form.level />
    <c-components.form_fields.school_search
        name_field=form.school_label
        id_field=form.school_id
        not_found_field=form.school_not_found
        scope="higher_ed"
        description="Saisis le nom de l'établissement"
        group="{{ form.dom_id }}"
        unique_id="{{ form.dom_id }}" />
    {% include "beneficiary/funnels/partials/fields/out_of_scope_postal_code.html" %}
    <c-components.form_fields.formation_search
        name_field=form.formation_label
        id_field=form.formation_id
        not_found_field=form.formation_not_found
        school_id_field=form.school_id
        scope="higher_ed"
        description="Recherche par nom"
        group="{{ form.dom_id }}"
        unique_id="{{ form.dom_id }}" />
{% else %}
    <div x-data="{ level: '{{ form.level.value|default:'' }}' }"
         @select-change="level = $event.detail.value"
         class="flex flex-col gap-y-4">
        <c-components.form_fields.select field=form.level :watchable=True />
        <c-components.form_fields.select field=form.period_label />
        <template x-if="level != '' && !level.startsWith('bac_')">
            <div class="flex flex-col gap-y-4">
                <c-components.form_fields.school_search
                    name_field=form.school_label
                    id_field=form.school_id
                    not_found_field=form.school_not_found
                    scope="secondary"
                    description="Saisis le nom et/ou code postal de l'établissement"
                    group="{{ form.dom_id }}"
                    unique_id="{{ form.dom_id }}" />
                {% include "beneficiary/funnels/partials/fields/out_of_scope_postal_code.html" %}
                <c-components.form_fields.formation_search
                    name_field=form.formation_label
                    id_field=form.formation_id
                    not_found_field=form.formation_not_found
                    school_id_field=form.school_id
                    scope="secondary"
                    description="Recherche par nom"
                    group="{{ form.dom_id }}"
                    unique_id="{{ form.dom_id }}" />
            </div>
        </template>
        <template x-if="level.startsWith('bac_')">
            <div class="flex flex-col gap-y-4">
                <c-components.form_fields.school_search
                    name_field=form.school_label
                    id_field=form.school_id
                    not_found_field=form.school_not_found
                    scope="higher_ed"
                    description="Saisis le nom de l'établissement"
                    group="{{ form.dom_id }}"
                    unique_id="{{ form.dom_id }}-sup" />
                {% include "beneficiary/funnels/partials/fields/out_of_scope_postal_code.html" %}
                <c-components.form_fields.formation_search
                    name_field=form.formation_label
                    id_field=form.formation_id
                    not_found_field=form.formation_not_found
                    school_id_field=form.school_id
                    scope="higher_ed"
                    description="Recherche par nom"
                    group="{{ form.dom_id }}"
                    unique_id="{{ form.dom_id }}-sup" />
            </div>
        </template>
    </div>
{% endif %}
