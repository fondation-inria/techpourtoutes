<div id="events-grid" class="w-full{% if events %} grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6{% endif %}">
    {% for event in events %}
        <c-components.event-card
            :event="event"
            bookmark_action="{{ bookmark_action }}"
            category_color="bg-{{ event.category_color }}-500"
            heading_level="h2"
        />
    {% empty %}
        <c-components.event-empty-state title="Reviens bientôt&nbsp;!">
            <c-components.text>
                Aucun événement n'est programmé pour le moment.
            </c-components.text>
        </c-components.event-empty-state>
    {% endfor %}
</div>
