<div id="funnel-step" class="w-full flex flex-col">
    {% include "beneficiary/partials/inscription/progress.html" %}
    <c-components.card nobg=True>
        <c-patterns.form
            hx-post="{% url 'inscription_funnel' %}"
            hx-target="#funnel-step"
            hx-swap="outerHTML">
            <input type="hidden" name="action" value="training_experience">
            <c-components.title title="Rejoins le club, {{ first_name }}" variant="h1" />
            <p class="text-xs text-neutral-500">Tous les champs sont obligatoires</p>
            {% include "beneficiary/partials/inscription/training_experience_fields.html" %}
            <div class="flex justify-center">
                <c-components.button type="submit" label="{% if wants_mentor %}Continuer{% else %}Rejoindre le club{% endif %}" />
            </div>
        </c-patterns.form>
    </c-components.card>
</div>
