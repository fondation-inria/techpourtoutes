<div class="flex flex-col gap-y-2">
    <div class="flex items-center justify-between">
        <c-patterns.form
            hx-post="{% url 'inscription_funnel' %}"
            hx-target="#funnel-step"
            hx-swap="outerHTML">
            <input type="hidden" name="action" value="back">
            <input type="hidden" name="to" value="{{ step }}">
            <c-components.button type="submit" variant="quaternary" class="w-fit px-1 text-neutral-900! font-normal">
                <span class="flex items-center gap-1">
                    <c-components.icon name="chevron-down" class="w-4 h-4 rotate-90" />
                    Retour
                </span>
            </c-components.button>
        </c-patterns.form>
        {% if step == "mentoring_signup" %}
            <c-components.button
                label="Passer"
                type="button"
                variant="quaternary"
                class="w-fit px-1 text-neutral-900! font-normal"
                hx-get="{% url 'mentoring_signup_skip_modal' %}"
                hx-target="#modal-container"
                hx-swap="innerHTML"
            />
        {% endif %}
    </div>
    <div class="bg-yellow-500 mx-4 h-2 overflow-hidden">
        <div class="bg-green-500 h-full" style="width: {{ progress }}%"></div>
    </div>
</div>
