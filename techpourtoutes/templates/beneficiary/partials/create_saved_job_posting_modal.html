<c-components.modal title="Rejoins le club TechPourToutes pour enregistrer cette offre" closable=True>
    <br>
    <p class="text-center text-sm">
        Pour enregistrer cette offre et la retrouver facilement dans ton compte, il suffit de se
        créer un compte.
    </p>
    <br>
    <div class="flex flex-col items-center gap-4">
        <c-components.button label="Créer un compte" href="{% url "new_beneficiary_inscription_funnel" %}?saved_job_posting={{ job_posting.pk }}&back={{ way_back|urlencode:"" }}" />
        <c-components.button label="Se connecter" variant="secondary" href="{% url "login_request" %}?saved_job_posting={{ job_posting.pk }}&back={{ way_back|urlencode:"" }}" />
    </div>
</c-components.modal>
