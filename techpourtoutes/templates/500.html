<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>500 – TechPourToutes</title>
        <style>
            :root {
                --yellow: #fad207;
                --orange: #ff713d;
                --white: #ffffff;
                --ink: #0b1020;
                --text: #111827;
            }

            *, *::before, *::after { box-sizing: border-box; }

            html {
                background-color: var(--white);
                background-image:
                    linear-gradient(to right, black 1px, transparent 1px),
                    linear-gradient(to bottom, black 1px, transparent 1px);
                background-size: 60px 100%, 100% 60px;
                background-position: -1px 0, 0 32px;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                font-family: "Poppins", ui-sans-serif, system-ui, sans-serif;
                color: var(--text);
            }

            .site-header {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 0.75rem 1rem;
                background-color: var(--white);
            }

            .site-header img { height: 3.5rem; width: auto; display: block; }

            .middle {
                flex: 1;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                align-items: center;
                width: 100%;
            }

            main {
                display: flex;
                flex-direction: column;
                width: 100%;
                max-width: 72rem;
            }

            .column {
                display: flex;
                flex-direction: column;
                flex: 1;
                min-width: 0;
                max-width: 56rem;
                padding: 1.75rem 1rem;
                gap: 1rem;
            }

            /* ---------- Error block ---------- */

            .page {
                position: relative;
                isolation: isolate;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: flex-start;
                gap: 1rem;
                width: 100%;
                padding-bottom: 4rem;
            }

            .backdrop { display: none; }

            .title-row {
                display: flex;
                align-items: center;
                gap: 0.75rem;
                width: 100%;
            }

            .page h1 {
                margin: 0;
                font-family: "Newsreader", ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
                font-style: italic;
                font-weight: 800;
                font-size: 1.5rem;
                line-height: 1.2;
                text-align: center;
                color: var(--ink);
                background-color: var(--yellow);
                border: 1px solid var(--ink);
                border-radius: 9999px;
                padding: 1rem 2rem;
            }

            .card {
                width: 100%;
                background-color: var(--white);
                border: 1px solid var(--ink);
                padding: 1rem;
            }

            .card p { margin: 0; line-height: 1.5; }

            .cta {
                display: inline-block;
                padding: 0.75rem 1.5rem;
                border-radius: 6px;
                font-size: 0.875rem;
                line-height: 1.4;
                text-decoration: none;
                color: var(--ink);
                background-color: var(--yellow);
                box-shadow: 4px 4px 0 0 black;
            }

            .cta:active { box-shadow: none; }

            /* ---------- Footer ---------- */

            footer { padding: 1rem; }

            footer nav {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                align-items: center;
                row-gap: 1.5rem;
                background-color: var(--white);
            }

            footer a {
                padding: 0 1rem;
                font-size: 11px;
                line-height: 1.4;
                color: var(--text);
                text-decoration: underline;
                text-decoration-thickness: 1px;
                text-underline-offset: 4px;
                border-right: 1px solid var(--orange);
            }

            footer a:last-child { border-right: 0; }

            /* ---------- Breakpoints ---------- */

            @media (min-width: 768px) {
                main { flex: 1; flex-direction: row; justify-content: space-around; }

                /* L'illustration prend la hauteur restante plutôt qu'un 100vh
                   fixe : additionnée au footer, elle remplit exactement le
                   viewport, comme le funnel. */
                .page { flex: 1; }

                .backdrop {
                    display: block;
                    position: absolute;
                    top: -2rem;
                    left: 50%;
                    transform: translateX(-50%);
                    width: 100vw;
                    max-width: 56rem;
                    height: calc(100% + 4rem);
                    z-index: -1;
                    object-fit: cover;
                    border: 1px solid var(--ink);
                }

                .title-row, .card { width: 100vw; max-width: 56rem; }

                .page h1 { font-size: 2.25rem; padding: 0.5rem 2rem; }
                .column { padding-left: 2rem; padding-right: 2rem; }
            }

            @media (min-width: 1280px) {
                .column { padding-top: 2rem; padding-bottom: 2rem; }
            }

            @media (min-width: 1400px) {
                .site-header {
                    position: absolute;
                    top: 0;
                    left: 0;
                    padding: 0.75rem 0 0 1rem;
                    background-color: white;
                }
            }
        </style>
    </head>
    <body>
        <header class="site-header">
            <a href="/"><img src="/static/images/techpourtoutes-logo-new-beneficiary.png" alt="TechPourToutes"></a>
        </header>

        <div class="middle">
            <main>
                <div class="column">
                    <div class="page">
                        <img class="backdrop" src="/static/images/error-page-bg.webp" alt="">
                        <div class="title-row">
                            <h1>Problème serveur</h1>
                        </div>
                        <div class="card">
                            <p>
                                Dans le numérique, faire des erreurs fait partie du processus. L'important, c'est d'apprendre, d'améliorer et de recommencer&nbsp;!
                            </p>
                        </div>
                        <a class="cta" href="/">Retour à l'accueil</a>
                    </div>
                </div>
            </main>

            <footer>
                <nav>
                    <a href="/donnees-personnelles/">Données personnelles et cookies</a>
                    <a href="/mentions-legales/">Mentions légales</a>
                    <a href="/conditions-generales/">CGU - Coalition</a>
                    <a href="/pourquoi-nous-ecrivons-au-feminin/">Pourquoi nous écrivons au féminin</a>
                    <a href="/accessibilite/">Accessibilité : non conforme</a>
                </nav>
            </footer>
        </div>
    </body>
</html>
