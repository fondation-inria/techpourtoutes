<c-patterns.funnel_step post_url="{% url 'pro_inscription_funnel' %}" action="last_information" title="Dernières informations" submit_label="{% if is_last_step %}Rejoindre la coalition{% else %}Continuer{% endif %}">
    <c-slot name="header">
        <c-patterns.funnel_progress post_url="{% url 'pro_inscription_funnel' %}" progress="{{ progress }}" />
    </c-slot>
    {# Retired and jobless pros work in no structure to name: it is only asked once the type is known. #}
    <div x-data="{ structureType: '{{ form.structure_type.value|default:''|escapejs }}' }"
         @select-change="structureType = $event.detail.value"
         class="flex flex-col gap-y-4">
        <c-components.form_fields.select field=form.structure_type :watchable=True />
        <div x-show="structureType && !['retired', 'jobless'].includes(structureType)" x-cloak>
            <c-components.form_fields.input field=form.structure_name autocomplete="organization" />
        </div>
        <c-components.form_fields.input field=form.job_title autocomplete="organization-title" variant="{% if form.job_title.field.disabled %}disabled{% endif %}" />
        <c-components.form_fields.input field=form.phone autocomplete="tel" />
        <c-components.form_fields.input field=form.postal_code autocomplete="postal-code" />
    </div>
</c-patterns.funnel_step>
