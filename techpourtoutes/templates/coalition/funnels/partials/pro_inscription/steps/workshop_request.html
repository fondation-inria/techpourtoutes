<c-patterns.funnel_step post_url="{% url 'pro_inscription_funnel' %}" action="workshop_request" title="Demander un atelier" submit_label="{% if is_last_step %}Rejoindre la coalition{% else %}Continuer{% endif %}">
    <c-slot name="header">
        <c-patterns.funnel_progress post_url="{% url 'pro_inscription_funnel' %}" progress="{{ progress }}" />
    </c-slot>
    <c-components.form_fields.school_search
        name_field=form.school_label
        id_field=form.structure_uai
        not_found_field=form.school_not_found
        postal_field=form.postal_code
        scope="workshop"
        key="uai"
        description="Recherchez par nom et/ou code postal" />
    <c-components.form_fields.select field=form.job_title />
    <c-components.form_fields.checkbox_group field=form.ateliers description="Vous pouvez choisir plusieurs ateliers" />
    <c-components.form_fields.textarea field=form.remark rows="3" />
</c-patterns.funnel_step>
