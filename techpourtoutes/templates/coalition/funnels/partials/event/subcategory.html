<div id="funnel-step" class="w-full flex flex-col gap-y-4">
    <c-layout.partials.messages wrapper_class="w-full flex flex-col gap-y-2" />
    <c-components.card nobg=True>
        <c-patterns.form
            id="funnel-answers"
            hx-post="{{ funnel_url }}"
            hx-target="#funnel-step"
            hx-swap="outerHTML"
            x-data="{ subcategory: '{{ form.subcategory.value|default:''|escapejs }}' }"
            @select-change="subcategory = $event.detail.value">
            {% include "coalition/funnels/partials/event/carried_answers.html" %}
            <c-components.title title="{% if editing %}Modifier un événement{% else %}Proposer un événement{% endif %}" variant="h1" />
            <p class="description-text-xxs">Tous les champs sont obligatoires</p>
            <c-components.form_fields.select field=form.subcategory :watchable=True />
            <div x-show="subcategory == 'other'" x-cloak>
                <c-components.form_fields.input field=form.subcategory_other autocomplete="off" description="Le type est limité à 22 caractères" />
            </div>
            <div class="flex justify-center mt-4">
                <c-components.button type="submit" name="action" value="subcategory" label="Continuer" />
            </div>
        </c-patterns.form>
    </c-components.card>
</div>
