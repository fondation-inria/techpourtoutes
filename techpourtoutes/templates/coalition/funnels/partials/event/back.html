{# A sibling of the step's own form, never nested — HTML forbids that — which pulls that #}
{# form's fields in, so what she typed on this screen comes back with her. #}
<c-patterns.funnel_back post_url="{{ funnel_url }}" hx-include="#funnel-answers">
    <input type="hidden" name="to" value="{{ step }}">
</c-patterns.funnel_back>
