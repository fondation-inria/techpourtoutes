{% load static %}

<c-components.modal title="Bienvenue dans la coalition !">
    <c-slot name="image">
        <img src="{% static 'images/badge-purple.webp' %}" alt=""
             class="mx-auto mb-4 size-32" width="128" height="128" />
    </c-slot>
    <br>
    <p class="text-center text-sm">Merci beaucoup pour votre engagement&nbsp;!</p>
    <br>
    <p class="text-center text-sm">
        Nous prendrons contact avec vous sous 48 heures pour vous accompagner dans le programme.
    </p>
    <br>
    <div class="flex justify-center">
        <c-components.button label="Découvrir mon compte" hx-on:click="this.closest('dialog').close()" />
    </div>
</c-components.modal>
