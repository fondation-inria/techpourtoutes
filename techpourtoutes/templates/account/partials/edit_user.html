<div id="account-info-card" class="w-full">
    <c-components.card title="Informations personnelles">
        <div class="mt-3"></div>
        <c-patterns.form
            hx-post="{% url 'update_user' %}"
            hx-target="#account-info-card"
            hx-swap="outerHTML">
            <p class="description-text-xxs">Les champs suivis d'un astérisque (*) sont obligatoires.</p>
            <c-components.form_fields.input field=form.first_name />
            <c-components.form_fields.input field=form.last_name />
            <c-components.form_fields.input field=form.phone />
            {% if is_beneficiary %}
                <c-components.form_fields.input field=form.birth_date type="date" variant="disabled"
                    message="Pour modifier ce champ, il est possible de nous contacter par mail à bonjour@techpourtoutes.io."
                    message_class="text-blue-500"/>
            {% endif %}
            <c-components.form_fields.input field=form.postal_code />
            {% if is_pro %}
                {# Retired and jobless pros work in no structure to name, as in the inscription funnel. #}
                <div x-data="{ structureType: '{{ form.structure_type.value|default:''|escapejs }}' }"
                     @select-change="structureType = $event.detail.value"
                     class="flex flex-col gap-y-4">
                    <c-components.form_fields.select field=form.structure_type :watchable=True />
                    <c-components.form_fields.input field=form.job_title />
                    <div x-show="structureType && !['retired', 'jobless'].includes(structureType)" x-cloak>
                        <c-components.form_fields.input field=form.structure_name />
                    </div>
                </div>
            {% endif %}
            <div class="flex justify-end gap-2">
                <c-components.button label="Annuler" variant="secondary" type="button"
                    hx-get="{% url 'show_user_info' %}"
                    hx-target="#account-info-card"
                    hx-swap="outerHTML" />
                <c-components.button type="submit" label="Sauvegarder" />
            </div>
        </c-patterns.form>
    </c-components.card>
</div>
